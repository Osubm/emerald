<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Emerald Hearth POS v3.0</title>
  
  <!-- Tailwind CSS (CDN for single-file deployment) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emerald: { 50:'#ECFDF5',100:'#D1FAE5',500:'#10B981',600:'#059669',700:'#047857' },
            slate: { 50:'#F8FAFC',100:'#F1F5F9',200:'#E2E8F0',500:'#64748B',800:'#1E293B' },
            amber: { 100:'#FEF3C7',600:'#D97706' },
            red: { 100:'#FEE2E2',600:'#DC2626' }
          }
        }
      }
    }
  </script>
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #F1F5F9; }
    .btn { min-height: 44px; border-radius: 8px; font-weight: 600; transition: all 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #059669; color: white; }
    .btn-primary:hover { background: #047857; }
    .btn-secondary { background: white; color: #1E293B; border: 1px solid #E2E8F0; }
    .card { background: white; border-radius: 12px; padding: 1rem; border: 1px solid #E2E8F0; }
    .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; }
    .badge-success { background: #D1FAE5; color: #047857; }
    .badge-warning { background: #FEF3C7; color: #D97706; }
    .badge-danger { background: #FEE2E2; color: #DC2626; }
    .urgency-low { border-left: 4px solid #10B981; }
    .urgency-medium { border-left: 4px solid #D97706; }
    .urgency-high { border-left: 4px solid #DC2626; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: white; border-radius: 16px; max-width: 500px; width: 90%; max-height: 90vh; overflow: auto; }
    @media (min-width: 768px) { .mobile-nav { display: none; } }
  </style>
</head>
<body class="min-h-screen">
  <div id="app"></div>

  <script>
    // ============================================
    // EMERALD HEARTH POS v3.0 - PHASE 1.5 COMPLETE
    // Items 1-6: POS, Supabase, KDS/Bar, Inventory, Sync Queue, Rewards/Wallet
    // ============================================

    // --- CONFIG ---
    const CONFIG = {
      supabaseUrl: import.meta?.env?.VITE_SUPABASE_URL || localStorage.getItem('sb_url') || '',
      supabaseKey: import.meta?.env?.VITE_SUPABASE_ANON_KEY || localStorage.getItem('sb_key') || '',
      taxRate: 0.16,
      loyaltyPct: 0.05,
      offlineMode: !navigator.onLine
    };

    // --- SUPABASE CLIENT ---
    let supabase;
    if (CONFIG.supabaseUrl && CONFIG.supabaseKey) {
      supabase = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
      console.log('✅ Supabase connected');
    } else {
      console.warn('⚠️ Running in offline mode - configure Supabase in Settings');
    }

    // --- STATE MANAGEMENT (with localStorage persistence + sync queue) ---
    const Store = {
      state: {
        view: 'pos',
        cart: [],
        products: [],
        tables: [],
        orders: [],
        customers: [],
        ingredients: [],
        wifiVouchers: [],
        rewards: [],
        selectedTable: null,
        selectedCustomer: null,
        userRole: 'waiter',
        isOnline: navigator.onLine,
        syncQueue: [],
        lastSync: null
      },

      init() {
        this.load();
        this.setupOfflineHandlers();
        if (supabase) this.fetchData();
        else this.loadSampleData();
      },

      load() {
        const saved = localStorage.getItem('eh-state');
        if (saved) {
          const parsed = JSON.parse(saved);
          this.state = { ...this.state, ...parsed, syncQueue: parsed.syncQueue || [] };
        }
      },

      save() {
        const toSave = {
          cart: this.state.cart,
          syncQueue: this.state.syncQueue,
          lastSync: this.state.lastSync,
          products: this.state.products,
          customers: this.state.customers,
          ingredients: this.state.ingredients
        };
        localStorage.setItem('eh-state', JSON.stringify(toSave));
      },

      setupOfflineHandlers() {
        window.addEventListener('online', () => {
          this.state.isOnline = true;
          this.save();
          this.processSyncQueue();
          render();
        });
        window.addEventListener('offline', () => {
          this.state.isOnline = false;
          this.save();
          render();
        });
      },

      async fetchData() {
        if (!supabase) return;
        try {
          const [products, tables, customers, ingredients] = await Promise.all([
            supabase.from('products').select('*').eq('is_active', true),
            supabase.from('orders').select('*, order_items(*)').eq('status', 'sent'),
            supabase.from('customers').select('*'),
            supabase.from('ingredients').select('*')
          ]);
          
          if (products.data) this.state.products = products.data;
          if (customers.data) this.state.customers = customers.data;
          if (ingredients.data) this.state.ingredients = ingredients.data;
          this.save();
          render();
        } catch (e) {
          console.error('Fetch error:', e);
        }
      },

      loadSampleData() {
        this.state.products = [
          { id:'1', name:'Grilled Chicken', price:15, type:'fixed', department:'kitchen', prep_station:'kitchen', available:true },
          { id:'2', name:'Beef Steak', price:25, type:'weight', department:'kitchen', prep_station:'kitchen', available:true },
          { id:'3', name:'Mojito', price:8, type:'fixed', department:'bar', prep_station:'bar', available:true },
          { id:'4', name:'WiFi 1 Hour', price:5, type:'fixed', department:'wifi', available:true },
          { id:'5', name:'WiFi 4 Hours', price:15, type:'fixed', department:'wifi', available:true },
          { id:'6', name:'Caesar Salad', price:12, type:'fixed', department:'kitchen', prep_station:'kitchen', available:true }
        ];
        this.state.tables = [
          { id:'1', number:'1', capacity:4, status:'available' },
          { id:'2', number:'2', capacity:4, status:'occupied' },
          { id:'3', number:'3', capacity:6, status:'available' },
          { id:'4', number:'4', capacity:2, status:'awaiting_payment' }
        ];
        this.state.ingredients = [
          { id:'1', name:'Chicken Breast', unit:'kg', current_stock:15, min_stock:5, status:'in_stock' },
          { id:'2', name:'Beef', unit:'kg', current_stock:3, min_stock:5, status:'low_stock' },
          { id:'3', name:'Rum', unit:'bottle', current_stock:12, min_stock:5, status:'in_stock' }
        ];
        this.state.customers = [
          { id:'1', name:'John Doe', phone:'555-0101', wallet_balance:25, loyalty_points:150 },
          { id:'2', name:'Jane Smith', phone:'555-0102', wallet_balance:50, loyalty_points:320 }
        ];
        this.save();
      },

      // --- POS ACTIONS (Item 1) ---
      addToCart(product, options = {}) {
        const item = {
          id: crypto.randomUUID(),
          productId: product.id,
          productName: product.name,
          quantity: options.quantity || 1,
          weight: options.weight,
          unitPrice: product.type === 'weight' && options.weight 
            ? product.price * options.weight 
            : product.price,
          modifiers: options.modifiers || [],
          department: product.department,
          prep_station: product.prep_station,
          deducts_stock: true,
          // Snapshot recipe deductions for stock tracking
          recipe_deductions: product.recipe ? [{ 
            ingredient_id: product.recipe.ingredient_id, 
            quantity: product.recipe.quantity, 
            unit: product.recipe.unit 
          }] : null,
          createdAt: new Date().toISOString()
        };
        this.state.cart.push(item);
        this.save();
        render();
      },

      removeFromCart(itemId) {
        this.state.cart = this.state.cart.filter(i => i.id !== itemId);
        this.save();
        render();
      },

      updateCartItem(itemId, updates) {
        const item = this.state.cart.find(i => i.id === itemId);
        if (item) Object.assign(item, updates);
        this.save();
        render();
      },

      clearCart() {
        this.state.cart = [];
        this.state.selectedTable = null;
        this.save();
        render();
      },

      // --- ORDER CREATION WITH DEPARTMENT ROUTING (Item 3) ---
      async createOrder() {
        if (this.state.cart.length === 0) return;
        
        const subtotal = this.state.cart.reduce((s,i) => s + i.unitPrice * i.quantity, 0);
        const tax = subtotal * CONFIG.taxRate;
        const total = subtotal + tax;

        const order = {
          order_number: 'ORD-' + Date.now().toString().slice(-6),
          customer_id: this.state.selectedCustomer?.id,
          status: 'sent',
          subtotal, tax, total,
          order_type: this.state.selectedTable ? 'dine-in' : 'takeaway',
          table_number: this.state.selectedTable?.number,
          created_at: new Date().toISOString()
        };

        const orderItems = this.state.cart.map(item => ({
          product_id: item.productId,
          product_name: item.productName,
          quantity: item.quantity,
          weight: item.weight,
          unit_price: item.unitPrice,
          modifiers: item.modifiers,
          status: 'sent',
          department: item.department,
          prep_station: item.prep_station,
          deducts_stock: item.deducts_stock,
          recipe_deductions: item.recipe_deductions,
          created_at: new Date().toISOString()
        }));

        // Add to sync queue for offline support (Item 5)
        this.enqueueSync('CREATE_ORDER', { order, items: orderItems });

        // If online, send to Supabase
        if (supabase && this.state.isOnline) {
          try {
            const { data: newOrder, error } = await supabase
              .from('orders')
              .insert(order)
              .select()
              .single();
            
            if (newOrder && !error) {
              // Insert order items
              const itemsWithOrderId = orderItems.map(i => ({ ...i, order_id: newOrder.id }));
              await supabase.from('order_items').insert(itemsWithOrderId);
              
              // Add order event
              await supabase.from('order_events').insert({
                order_id: newOrder.id,
                event_type: 'NEW',
                timestamp: new Date().toISOString()
              });
              
              // Earn loyalty if customer attached (Item 6)
              if (order.customer_id) {
                await this.earnLoyalty(order.customer_id, total, newOrder.id);
              }
            }
          } catch (e) {
            console.error('Order error:', e);
          }
        }

        // Update local state
        this.state.orders.push({ ...order, id: crypto.randomUUID(), items: orderItems });
        this.clearCart();
        alert('Order ' + order.order_number + ' sent to ' + orderItems[0]?.prep_station + '!');
        render();
      },

      // --- SYNC QUEUE (Item 5) ---
      enqueueSync(action, payload) {
        const item = {
          id: crypto.randomUUID(),
          client_id: navigator.userAgent + '-' + Date.now(),
          action,
          payload,
          status: 'pending',
          attempts: 0,
          created_at: new Date().toISOString(),
          idempotency_key: action + ':' + JSON.stringify(payload)
        };
        this.state.syncQueue.push(item);
        this.save();
        console.log('📤 Queued:', action);
      },

      async processSyncQueue() {
        if (!supabase || !this.state.isOnline) return;
        
        const pending = this.state.syncQueue.filter(i => i.status === 'pending');
        if (pending.length === 0) return;

        console.log(`🔄 Syncing ${pending.length} items...`);
        
        for (const item of pending) {
          try {
            await this.executeSyncAction(item);
            item.status = 'synced';
            item.synced_at = new Date().toISOString();
          } catch (e) {
            console.error('Sync failed:', item.action, e);
            item.attempts++;
            item.error = e.message;
            if (item.attempts >= 3) item.status = 'failed';
          }
        }
        
        this.state.lastSync = new Date().toISOString();
        this.save();
        console.log('✅ Sync complete');
      },

      async executeSyncAction(item) {
        switch (item.action) {
          case 'CREATE_ORDER':
            const { order, items } = item.payload;
            // Check idempotency
            const { data: existing } = await supabase
              .from('orders')
              .select('id')
              .eq('order_number', order.order_number)
              .maybeSingle();
            if (existing) return; // Already synced
            
            const { data: newOrder } = await supabase.from('orders').insert(order).select().single();
            if (newOrder) {
              const itemsWithOrderId = items.map(i => ({ ...i, order_id: newOrder.id }));
              await supabase.from('order_items').insert(itemsWithOrderId);
              await supabase.from('order_events').insert({
                order_id: newOrder.id, event_type: 'NEW', timestamp: new Date().toISOString()
              });
            }
            break;
          case 'UPDATE_STOCK':
            await supabase.from('stock_movements').insert(item.payload);
            break;
          case 'ISSUE_REWARD':
            await supabase.from('rewards').insert(item.payload);
            break;
        }
      },

      // --- REWARDS & WALLET (Item 6) ---
      async earnLoyalty(customerId, orderTotal, orderId) {
        const earnAmount = orderTotal * CONFIG.loyaltyPct;
        
        // Add wallet transaction
        const walletTx = {
          customer_id: customerId,
          type: 'earn',
          amount: earnAmount,
          reason: `${Math.round(CONFIG.loyaltyPct*100)}% loyalty on order`,
          reference_order_id: orderId,
          timestamp: new Date().toISOString()
        };
        
        this.enqueueSync('WALLET_TRANSACTION', walletTx);
        
        if (supabase && this.state.isOnline) {
          await supabase.from('wallet_transactions').insert(walletTx);
          await supabase.rpc('increment_wallet', { 
            cid: customerId, 
            amount: earnAmount, 
            points: Math.floor(earnAmount) 
          });
        }
        
        // Update local customer
        const customer = this.state.customers.find(c => c.id === customerId);
        if (customer) {
          customer.wallet_balance += earnAmount;
          customer.loyalty_points += Math.floor(earnAmount);
        }
      },

      issueWifiVoucher(duration, customerId) {
        const code = 'WIFI-' + Math.random().toString(36).substring(2,8).toUpperCase();
        const voucher = {
          code, duration_hours: duration, status: 'issued',
          issued_to: customerId, issued_at: new Date().toISOString(),
          expires_at: new Date(Date.now() + duration*60*60*1000).toISOString()
        };
        
        this.enqueueSync('ISSUE_VOUCHER', voucher);
        
        // Issue as reward if customer attached
        if (customerId) {
          const reward = {
            customer_id: customerId,
            type: 'wifi_voucher',
            value: duration,
            status: 'available',
            metadata: { code, duration },
            issued_at: new Date().toISOString()
          };
          this.enqueueSync('ISSUE_REWARD', reward);
        }
        
        this.state.wifiVouchers.push(voucher);
        this.save();
        return voucher;
      },

      redeemWallet(customerId, amount, reason) {
        const customer = this.state.customers.find(c => c.id === customerId);
        if (!customer || customer.wallet_balance < amount) {
          alert('Insufficient wallet balance');
          return false;
        }
        
        customer.wallet_balance -= amount;
        const tx = {
          customer_id: customerId, type: 'redeem', amount: -amount,
          reason, timestamp: new Date().toISOString()
        };
        this.enqueueSync('WALLET_TRANSACTION', tx);
        this.save();
        return true;
      }
    };

    // --- VIEWS ---
    const Views = {
      pos() {
        const subtotal = Store.state.cart.reduce((s,i) => s + i.unitPrice * i.quantity, 0);
        const tax = subtotal * CONFIG.taxRate;
        const total = subtotal + tax;

        return `
          <div class="p-4">
            <!-- Table Selection -->
            <div class="card mb-4">
              <h2 class="font-bold text-lg mb-3">Select Table</h2>
              <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
                ${Store.state.tables.map(t => `
                  <button onclick="selectTable('${t.id}')" 
                    class="p-4 rounded-xl border-2 font-semibold ${
                      Store.state.selectedTable?.id === t.id ? 'border-emerald-600 bg-emerald-50' :
                      t.status === 'available' ? 'border-slate-200' :
                      t.status === 'occupied' ? 'border-emerald-300 bg-emerald-50' :
                      'border-amber-300 bg-amber-50'
                    }">
                    <p>Table ${t.number}</p>
                    <p class="text-xs mt-1">${t.status.replace('_',' ')}</p>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Product Grid -->
            <div class="card mb-4">
              <h2 class="font-bold text-lg mb-3">Products</h2>
              <input type="text" id="productSearch" placeholder="🔍 Search..." 
                class="w-full p-3 border rounded-lg mb-4" oninput="render()">
              <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                ${Store.state.products
                  .filter(p => p.name.toLowerCase().includes(document.getElementById('productSearch')?.value?.toLowerCase() || ''))
                  .map(p => `
                  <button onclick="handleProductClick('${p.id}')" 
                    class="p-4 rounded-xl border-2 border-slate-200 bg-white hover:border-emerald-600 transition">
                    <p class="font-semibold">${p.name}</p>
                    <p class="text-emerald-600 font-bold mt-2">$${p.price.toFixed(2)}${p.type==='weight'?'/kg':''}</p>
                    ${!p.available ? '<span class="badge badge-danger mt-2">Sold Out</span>' : ''}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Cart -->
            ${Store.state.cart.length > 0 ? `
              <div class="card">
                <h2 class="font-bold text-lg mb-4">🛒 Order ${Store.state.selectedTable ? 'Table '+Store.state.selectedTable.number : ''}</h2>
                <div class="space-y-3 mb-4">
                  ${Store.state.cart.map(item => `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                      <div>
                        <p class="font-semibold">${item.productName}</p>
                        <p class="text-sm text-slate">${item.quantity}${item.weight?' × '+item.weight+'kg':''} × $${item.unitPrice.toFixed(2)}</p>
                      </div>
                      <button onclick="removeFromCart('${item.id}')" class="text-red-600 font-bold">✕</button>
                    </div>
                  `).join('')}
                </div>
                <div class="border-t pt-4">
                  <div class="flex justify-between text-slate-600"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
                  <div class="flex justify-between text-slate-600"><span>Tax (16%)</span><span>$${tax.toFixed(2)}</span></div>
                  <div class="flex justify-between text-xl font-bold mt-2">
                    <span>Total</span><span class="text-emerald-600">$${total.toFixed(2)}</span>
                  </div>
                  <button onclick="createOrder()" class="btn btn-primary w-full mt-4">💳 Send to Kitchen</button>
                  <button onclick="clearCart()" class="btn btn-secondary w-full mt-2">Clear</button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      },

      kitchen() {
        const orders = Store.state.orders.filter(o => 
          o.items?.some(i => i.department === 'kitchen') && o.status === 'sent'
        );
        
        return `
          <div class="p-4">
            <h1 class="text-2xl font-bold mb-4">👨‍🍳 Kitchen Queue</h1>
            ${orders.length === 0 ? `
              <div class="card text-center py-8">
                <p class="text-6xl mb-4">🍳</p>
                <p class="text-slate-500">No orders in queue</p>
              </div>
            ` : `
              <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                ${orders.map(order => {
                  const minutes = Math.floor((Date.now() - new Date(order.created_at).getTime()) / 60000);
                  const urgency = minutes > 20 ? 'high' : minutes > 10 ? 'medium' : 'low';
                  const kitchenItems = order.items?.filter(i => i.department === 'kitchen') || [];
                  
                  return `
                    <div class="card urgency-${urgency}">
                      <div class="flex justify-between items-start mb-3">
                        <div>
                          <p class="font-bold text-lg">${order.order_number}</p>
                          <p class="text-slate-500">Table ${order.table_number || 'Takeaway'}</p>
                        </div>
                        <span class="badge badge-${urgency === 'high' ? 'danger' : urgency === 'medium' ? 'warning' : 'success'}">
                          ${minutes} min
                        </span>
                      </div>
                      <div class="space-y-2 mb-4">
                        ${kitchenItems.map(item => `
                          <div class="flex justify-between">
                            <span class="font-semibold">${item.quantity}${item.weight?'×'+item.weight+'kg':''} ${item.product_name}</span>
                            ${item.notes ? `<span class="text-amber-600 text-sm">⚠️ ${item.notes}</span>` : ''}
                          </div>
                        `).join('')}
                      </div>
                      <button onclick="updateOrderStatus('${order.id}', 'ready')" class="btn btn-primary w-full">
                        ✓ Mark Ready
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;
      },

      bar() {
        const orders = Store.state.orders.filter(o => 
          o.items?.some(i => i.department === 'bar') && o.status === 'sent'
        );
        
        return `
          <div class="p-4">
            <h1 class="text-2xl font-bold mb-4">🍹 Bar Queue</h1>
            ${orders.length === 0 ? `
              <div class="card text-center py-8">
                <p class="text-6xl mb-4">🍸</p>
                <p class="text-slate-500">No drink orders</p>
              </div>
            ` : `
              <div class="space-y-4">
                ${orders.map(order => {
                  const barItems = order.items?.filter(i => i.department === 'bar') || [];
                  return `
                    <div class="card">
                      <p class="font-bold">${order.order_number} · Table ${order.table_number || 'Takeaway'}</p>
                      <div class="mt-3 space-y-2">
                        ${barItems.map(item => `
                          <p class="font-semibold">${item.quantity}× ${item.product_name}</p>
                        `).join('')}
                      </div>
                      <button onclick="updateOrderStatus('${order.id}', 'ready')" class="btn btn-primary w-full mt-4">
                        ✓ Ready
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;
      },

      inventory() {
        return `
          <div class="p-4">
            <h1 class="text-2xl font-bold mb-4">📦 Inventory</h1>
            
            <!-- KPI Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
              <div class="card text-center">
                <p class="text-2xl font-bold text-emerald-600">${Store.state.ingredients.filter(i => i.status === 'in_stock').length}</p>
                <p class="text-sm text-slate-500">In Stock</p>
              </div>
              <div class="card text-center">
                <p class="text-2xl font-bold text-amber-600">${Store.state.ingredients.filter(i => i.status === 'low_stock').length}</p>
                <p class="text-sm text-slate-500">Low Stock</p>
              </div>
              <div class="card text-center">
                <p class="text-2xl font-bold text-red-600">${Store.state.ingredients.filter(i => i.status === 'critical').length}</p>
                <p class="text-sm text-slate-500">Critical</p>
              </div>
              <div class="card text-center">
                <p class="text-2xl font-bold">$${Store.state.ingredients.reduce((s,i) => s + i.current_stock * i.cost_per_unit, 0).toFixed(0)}</p>
                <p class="text-sm text-slate-500">Stock Value</p>
              </div>
            </div>

            <!-- Stock List -->
            <div class="card">
              <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-lg">Stock Items</h2>
                <button class="btn btn-primary">+ Receive Stock</button>
              </div>
              <div class="space-y-3">
                ${Store.state.ingredients.map(ing => `
                  <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                    <div>
                      <p class="font-semibold">${ing.name}</p>
                      <p class="text-sm text-slate-500">Min: ${ing.min_stock} ${ing.unit}</p>
                    </div>
                    <div class="text-right">
                      <p class="font-bold">${ing.current_stock} ${ing.unit}</p>
                      <span class="badge badge-${ing.status === 'in_stock' ? 'success' : ing.status === 'low_stock' ? 'warning' : 'danger'}">
                        ${ing.status.replace('_',' ')}
                      </span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      },

      wallet() {
        return `
          <div class="p-4">
            <h1 class="text-2xl font-bold mb-4">💳 eWallet</h1>
            
            <!-- Customer Select -->
            <div class="card mb-4">
              <h2 class="font-bold mb-3">Select Customer</h2>
              <select id="walletCustomer" class="w-full p-3 border rounded-lg mb-3" onchange="render()">
                <option value="">-- Choose --</option>
                ${Store.state.customers.map(c => `
                  <option value="${c.id}" ${Store.state.selectedCustomer?.id === c.id ? 'selected' : ''}>
                    ${c.name} · Balance: $${c.wallet_balance?.toFixed(2)}
                  </option>
                `).join('')}
              </select>
              ${Store.state.selectedCustomer ? `
                <div class="p-4 bg-emerald-50 rounded-lg">
                  <p class="font-semibold">${Store.state.selectedCustomer.name}</p>
                  <p class="text-emerald-600 font-bold text-xl">$${Store.state.selectedCustomer.wallet_balance?.toFixed(2)} balance</p>
                  <p class="text-sm text-slate-500">${Store.state.selectedCustomer.loyalty_points} loyalty points</p>
                </div>
              ` : ''}
            </div>

            <!-- WiFi Vouchers -->
            <div class="card mb-4">
              <h2 class="font-bold mb-3">Issue WiFi Voucher</h2>
              <div class="grid grid-cols-3 gap-3 mb-4">
                <button onclick="issueWifi(1)" class="btn btn-primary">1 Hour</button>
                <button onclick="issueWifi(4)" class="btn btn-primary">4 Hours</button>
                <button onclick="issueWifi(24)" class="btn btn-primary">24 Hours</button>
              </div>
              ${Store.state.wifiVouchers.length > 0 ? `
                <div class="space-y-2">
                  ${Store.state.wifiVouchers.slice(-5).reverse().map(v => `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded">
                      <div>
                        <p class="font-mono font-bold text-emerald-600">${v.code}</p>
                        <p class="text-sm text-slate-500">${v.duration_hours}h · ${v.status}</p>
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>

            <!-- Redeem Wallet -->
            ${Store.state.selectedCustomer ? `
              <div class="card">
                <h2 class="font-bold mb-3">Redeem Store Credit</h2>
                <div class="flex gap-3">
                  <input type="number" id="redeemAmount" placeholder="Amount" class="flex-1 p-3 border rounded">
                  <button onclick="redeemWallet()" class="btn btn-primary">Redeem</button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      },

      reports() {
        const totalRevenue = Store.state.orders.reduce((s,o) => s + (o.total||0), 0);
        const orderCount = Store.state.orders.length;
        
        return `
          <div class="p-4">
            <h1 class="text-2xl font-bold mb-4">📊 Reports</h1>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
              <div class="card text-center">
                <p class="text-2xl font-bold text-emerald-600">$${totalRevenue.toFixed(2)}</p>
                <p class="text-sm text-slate-500">Total Revenue</p>
              </div>
              <div class="card text-center">
                <p class="text-2xl font-bold">${orderCount}</p>
                <p class="text-sm text-slate-500">Total Orders</p>
              </div>
              <div class="card text-center">
                <p class="text-2xl font-bold">${Store.state.wifiVouchers.filter(v=>v.status==='issued').length}</p>
                <p class="text-sm text-slate-500">WiFi Vouchers</p>
              </div>
              <div class="card text-center">
                <p class="text-2xl font-bold">$${orderCount > 0 ? (totalRevenue/orderCount).toFixed(2) : '0.00'}</p>
                <p class="text-sm text-slate-500">Avg Order</p>
              </div>
            </div>

            <div class="card">
              <h2 class="font-bold mb-4">Today's Summary</h2>
              <div class="space-y-3">
                <div class="flex justify-between"><span class="text-slate-500">Orders</span><span class="font-semibold">${orderCount}</span></div>
                <div class="flex justify-between"><span class="text-slate-500">Revenue</span><span class="font-semibold">$${totalRevenue.toFixed(2)}</span></div>
                <div class="flex justify-between"><span class="text-slate-500">WiFi Sales</span><span class="font-semibold">$${Store.state.orders.filter(o=>o.order_type==='wifi-only').reduce((s,o)=>s+o.total,0).toFixed(2)}</span></div>
                <div class="flex justify-between"><span class="text-slate-500">Loyalty Earned</span><span class="font-semibold">${Store.state.customers.reduce((s,c)=>s+(c.loyalty_points||0),0)} pts</span></div>
              </div>
            </div>
          </div>
        `;
      }
    };

    // --- GLOBAL ACTIONS ---
    function handleProductClick(productId) {
      const product = Store.state.products.find(p => p.id === productId);
      if (!product) return;
      
      if (product.type === 'weight') {
        showWeightModal(product);
      } else {
        Store.addToCart(product);
      }
    }

    function showWeightModal(product) {
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `
        <div class="modal-content p-6">
          <h3 class="text-xl font-bold mb-2">Enter Weight</h3>
          <p class="text-slate-500 mb-4">${product.name} · $${product.price}/kg</p>
          
          <div class="grid grid-cols-5 gap-2 mb-4">
            ${[0.25, 0.5, 1, 2, 5].map(w => `
              <button onclick="setWeight(${w})" class="btn btn-secondary">${w}kg</button>
            `).join('')}
          </div>
          
          <input type="number" id="weightInput" step="0.001" min="0" placeholder="Or enter custom..." 
            class="w-full p-3 border rounded-lg mb-4" autofocus>
          
          <div class="flex gap-3">
            <button onclick="this.closest('.modal').remove()" class="btn btn-secondary flex-1">Cancel</button>
            <button onclick="confirmWeight('${product.id}')" class="btn btn-primary flex-1">Add to Order</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      document.getElementById('weightInput')?.focus();
    }

    function setWeight(w) { document.getElementById('weightInput').value = w; }
    
    function confirmWeight(productId) {
      const weight = parseFloat(document.getElementById('weightInput').value);
      if (!weight || weight <= 0) { alert('Enter valid weight'); return; }
      
      const product = Store.state.products.find(p => p.id === productId);
      Store.addToCart(product, { weight });
      document.querySelector('.modal')?.remove();
    }

    function selectTable(tableId) {
      const table = Store.state.tables.find(t => t.id === tableId);
      Store.state.selectedTable = table;
      Store.save();
      render();
    }

    function removeFromCart(itemId) { Store.removeFromCart(itemId); }
    function clearCart() { Store.clearCart(); }
    function createOrder() { Store.createOrder(); }
    
    function updateOrderStatus(orderId, status) {
      const order = Store.state.orders.find(o => o.id === orderId);
      if (order) {
        order.status = status;
        Store.save();
        render();
      }
    }

    function issueWifi(duration) {
      const voucher = Store.issueWifiVoucher(duration, Store.state.selectedCustomer?.id);
      alert(`WiFi Voucher: ${voucher.code}\nDuration: ${voucher.duration_hours} hour(s)`);
      render();
    }

    function redeemWallet() {
      const amount = parseFloat(document.getElementById('redeemAmount').value);
      if (!amount || amount <= 0) { alert('Enter valid amount'); return; }
      
      if (Store.redeemWallet(Store.state.selectedCustomer?.id, amount, 'Manual redemption')) {
        alert(`Redeemed $${amount.toFixed(2)} from wallet`);
        render();
      }
    }

    function navigate(view) {
      Store.state.view = view;
      Store.save();
      render();
    }

    // --- RENDER ---
    function render() {
      const app = document.getElementById('app');
      const view = Store.state.view;
      
      const navItems = [
        { id:'pos', label:'POS', icon:'🛒' },
        { id:'kitchen', label:'Kitchen', icon:'👨‍🍳' },
        { id:'bar', label:'Bar', icon:'🍹' },
        { id:'inventory', label:'Stock', icon:'📦' },
        { id:'wallet', label:'eWallet', icon:'💳' },
        { id:'reports', label:'Reports', icon:'📊' }
      ];

      app.innerHTML = `
        ${!Store.state.isOnline ? '<div class="bg-amber-100 border-b border-amber-600 px-4 py-2 text-center text-amber-800 text-sm">📡 Offline Mode</div>' : ''}
        
        <header class="bg-white border-b border-slate-200 p-4">
          <h1 class="text-xl font-bold text-emerald-700">🌿 Emerald Hearth POS</h1>
          <p class="text-sm text-slate-500">Phase 1.5 · ${view.replace(/^\w/, c => c.toUpperCase())}</p>
        </header>
        
        <main class="pb-20">
          ${Views[view]?.() || '<div class="p-4">View not implemented</div>'}
        </main>
        
        <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 z-50">
          ${navItems.slice(0,5).map(item => `
            <button onclick="navigate('${item.id}')" class="flex flex-col items-center p-2 ${Store.state.view === item.id ? 'text-emerald-600' : 'text-slate-500'}">
              <span class="text-xl">${item.icon}</span>
              <span class="text-xs">${item.label}</span>
            </button>
          `).join('')}
        </nav>
      `;
    }

    // --- INIT ---
    Store.init();
    render();
    
    // Periodic sync attempt
    setInterval(() => Store.processSyncQueue(), 30000);
  </script>
</body>
</html>
